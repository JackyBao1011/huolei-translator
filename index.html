<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>火雷对话翻译 🔥⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0c29;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    padding: 12px;
  }
  .container {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; padding: 24px 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 { text-align: center; font-size: 20px; color: #fff; margin-bottom: 4px; }
  .sub { text-align: center; color: rgba(255,255,255,0.35); font-size: 12px; margin-bottom: 20px; }

  .lang-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 24px;
  }
  .lang-box {
    background: rgba(255,255,255,0.06); border-radius: 10px;
    padding: 8px 14px; color: rgba(255,255,255,0.7); font-size: 14px;
    text-align: center; min-width: 70px;
  }
  .lang-box.src { color: #ff9100; border: 1px solid rgba(255,145,0,0.3); }
  .lang-box.tgt { color: #80d8ff; border: 1px solid rgba(128,216,255,0.3); }
  .arrow { color: rgba(255,255,255,0.2); font-size: 18px; }

  .record-area {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 20px;
  }
  .btn-record {
    width: 80px; height: 80px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: #fff; font-size: 32px; cursor: pointer;
    transition: all 0.15s; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(255,65,108,0.3);
  }
  .btn-record:active { transform: scale(0.92); }
  .btn-record.recording {
    background: #e53935;
    animation: rec-pulse 0.6s infinite;
  }
  @keyframes rec-pulse {
    0% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
    50% { transform: scale(1.06); box-shadow: 0 8px 50px rgba(255,65,108,0.7); }
    100% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
  }
  .record-hint {
    color: rgba(255,255,255,0.3);
    font-size: 13px; margin-top: 10px; text-align: center;
    min-height: 20px;
  }

  .result-area {
    background: rgba(0,0,0,0.35);
    border-radius: 16px; padding: 16px;
    min-height: 120px; max-height: 300px;
    overflow-y: auto; margin-bottom: 12px;
  }
  .result-area::-webkit-scrollbar { width: 3px; }
  .result-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .result-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .result-item:last-child { border-bottom: none; }
  .result-original { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.5; margin-bottom: 2px; }
  .result-translated { color: #80d8ff; font-size: 17px; line-height: 1.5; font-weight: 500; }
  .result-label { display: inline-block; font-size: 10px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); padding: 1px 6px; border-radius: 6px; margin-right: 4px; }
  .result-time { font-size: 10px; color: rgba(255,255,255,0.15); margin-top: 2px; }
  .placeholder { text-align: center; color: rgba(255,255,255,0.12); padding: 30px 10px; font-size: 14px; line-height: 1.8; }

  .controls { display: flex; gap: 10px; justify-content: center; }
  .btn-clear { padding: 8px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.4); font-size: 13px; cursor: pointer; }
  .btn-clear:active { background: rgba(255,255,255,0.08); }

  .status-dot-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #555; }
  .dot.proc { background: #2979ff; box-shadow: 0 0 8px #2979ff66; animation: blink 0.5s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-text { color: rgba(255,255,255,0.35); font-size: 12px; }

  @media (max-width: 400px) {
    .container { padding: 18px 12px; }
    .btn-record { width: 72px; height: 72px; font-size: 28px; }
    .result-translated { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔥⚡ 火雷对话翻译</h1>
  <p class="sub">按住录音 · 松手翻译 · 无需特殊浏览器</p>

  <div class="status-dot-wrap">
    <span class="dot" id="statusDot"></span>
    <span class="status-text" id="statusText">待机中</span>
  </div>

  <div class="lang-row">
    <div class="lang-box src" id="langSource">英语</div>
    <span class="arrow">→</span>
    <div class="lang-box tgt" id="langTarget">中文</div>
  </div>

  <div class="record-area">
    <button class="btn-record" id="btnRecord">🎤</button>
    <div class="record-hint" id="recordHint">👇 按住说话，松手翻译</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="placeholder">
      按住🎤按钮<br>
      对方说英语，松手显示中文<br>
      或您说中文，松手显示英文
    </div>
  </div>

  <div class="controls">
    <button class="btn-clear" id="btnClear">🗑️ 清空</button>
  </div>
</div>

<script>
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let transcriptHistory = [];

const D = {
  btn: document.getElementById('btnRecord'),
  hint: document.getElementById('recordHint'),
  area: document.getElementById('resultArea'),
  dot: document.getElementById('statusDot'),
  st: document.getElementById('statusText'),
  clear: document.getElementById('btnClear'),
  src: document.getElementById('langSource'),
  tgt: document.getElementById('langTarget'),
};

async function startRecord() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mt = 'audio/webm;codecs=opus';
    mediaRecorder = new MediaRecorder(s, { mimeType: mt });
    audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      s.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mt });
      D.hint.textContent = '🔄 识别翻译中...';
      D.dot.className = 'dot proc';
      D.st.textContent = '处理中...';
      await processAudio(blob);
    };
    mediaRecorder.start();
    isRecording = true;
    D.btn.classList.add('recording');
    D.btn.textContent = '⏹';
    D.hint.textContent = '🔴 录音中...松手停止';
  } catch(e) {
    D.hint.textContent = '❌ 请授权麦克风权限';
  }
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  D.btn.classList.remove('recording');
  D.btn.textContent = '🎤';
}

async function processAudio(blob) {
  try {
    // 先用 Google Speech Recognition API（免费，超快）
    const text = await recognizeWithGoogle(blob);
    if (text && text.trim()) {
      await translateText(text.trim());
      return;
    }
    // 备用
    D.hint.textContent = '⚠️ 未识别到语音，请重试';
  } catch(e) {
    D.hint.textContent = '❌ 识别失败，再试一次';
  }
  D.dot.className = 'dot';
  D.st.textContent = '待机中';
}

// Google Speech Recognition - 非常快
async function recognizeWithGoogle(blob) {
  // 将音频转为 FLAC 或 WAV 格式（Google 支持的最好）
  // 用 AudioContext 转码
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const arrayBuffer = await blob.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  // 降采样到 16kHz 单声道（Google 要求）
  const sampleRate = 16000;
  const length = Math.floor(audioBuffer.length * sampleRate / audioBuffer.sampleRate);
  const offscreen = new OfflineAudioContext(1, length, sampleRate);
  const source = offscreen.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offscreen.destination);
  source.start();
  const rendered = await offscreen.startRendering();

  // 转成 16-bit PCM
  const pcmData = new Int16Array(rendered.length);
  for (let i = 0; i < rendered.length; i++) {
    const s = Math.max(-1, Math.min(1, rendered.getChannelData(0)[i]));
    pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }

  // 转成 base64
  const bytes = new Uint8Array(pcmData.buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  const base64 = btoa(binary);

  // 调用 Google Speech Recognition API（免费接口）
  // 用 flac 格式（Google 支持）
  const flacBlob = await convertToFlac(audioBuffer, sampleRate);
  const flacBase64 = await blobToBase64(flacBlob);

  // Google 的免费语音识别接口
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<speak>
  <audio source="data:audio/flac;base64,${flacBase64}"/>
</speak>`;

  const resp = await fetch('https://www.google.com/speech-api/v2/recognize?output=json&lang=en-US&key=AIzaSyBOti4mM-6x9WDnZIjIeyEU21OpBXqWBgw', {
    method: 'POST',
    headers: { 'Content-Type': 'audio/l16; rate=16000; channels=1' },
    body: pcmData.buffer
  });

  if (resp.ok) {
    const text = await resp.text();
    // 解析 Google 返回
    const lines = text.split('\n');
    for (const line of lines) {
      try {
        const obj = JSON.parse(line);
        if (obj.result && obj.result.length > 0) {
          const alt = obj.result[0].alternative;
          if (alt && alt.length > 0 && alt[0].transcript) {
            return alt[0].transcript;
          }
        }
      } catch(e) {}
    }
  }

  throw new Error('Google API failed');
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// 简化的 FLAC 编码（用 WAV 替代，Google 也支持）
async function convertToFlac(audioBuffer, targetSr) {
  // 用 WAV 格式，Google 支持
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = targetSr * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = audioBuffer.length * numChannels * bitsPerSample / 8;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  // WAV header
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, targetSr, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeString(view, 36, 'data');
  view.setUint32(40, dataSize, true);

  // PCM data
  const channelData = audioBuffer.getChannelData(0);
  let offset = 44;
  for (let i = 0; i < audioBuffer.length; i++) {
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }

  return new Blob([buffer], { type: 'audio/wav' });
}

function writeString(view, offset, str) {
  for (let i = 0; i < str.length; i++) {
    view.setUint8(offset + i, str.charCodeAt(i));
  }
}

// ====== 翻译 ======
async function translateText(text) {
  const hasCn = /[\u4e00-\u9fa5]/.test(text);
  D.src.textContent = hasCn ? '中文' : '英语';
  D.tgt.textContent = hasCn ? '英语' : '中文';

  let translated = text;
  try {
    const sl = hasCn ? 'zh-CN' : 'auto';
    const tl = hasCn ? 'en' : 'zh-CN';
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d && d[0]) translated = d[0].map(i => i[0]).join('');
  } catch(e) {}

  if (transcriptHistory.length > 0 && transcriptHistory[transcriptHistory.length - 1].original === text) return;

  transcriptHistory.push({
    original: text,
    translated: translated,
    time: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
    dir: hasCn ? '中→英' : '英→中'
  });

  renderResults();
  D.hint.textContent = '✅ 完成，继续按住说话';
  D.dot.className = 'dot';
  D.st.textContent = '待机中';
}

function renderResults() {
  if (transcriptHistory.length === 0) {
    D.area.innerHTML = `<div class="placeholder">按住🎤按钮<br>对方说英语，松手显示中文</div>`;
    return;
  }
  D.area.innerHTML = transcriptHistory.slice(-20).map(i => `
    <div class="result-item">
      <div class="result-original"><span class="result-label">${i.dir}</span>${esc(i.original)}</div>
      <div class="result-translated">${esc(i.translated)}</div>
      <div class="result-time">${i.time}</div>
    </div>
  `).join('');
  D.area.scrollTop = D.area.scrollHeight;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// 事件
D.btn.addEventListener('touchstart', e => { e.preventDefault(); if (!isRecording) startRecord(); }, { passive: false });
D.btn.addEventListener('touchend', e => { e.preventDefault(); if (isRecording) stopRecord(); }, { passive: false });
D.btn.addEventListener('touchcancel', e => { if (isRecording) stopRecord(); }, { passive: false });
D.btn.addEventListener('mousedown', () => { if (!isRecording) startRecord(); });
D.btn.addEventListener('mouseup', () => { if (isRecording) stopRecord(); });
D.btn.addEventListener('mouseleave', () => { if (isRecording) stopRecord(); });
D.clear.addEventListener('click', () => { transcriptHistory = []; renderResults(); D.hint.textContent = '👇 按住说话，松手翻译'; });
</script>
</body>
</html>
