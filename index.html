<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火雷实时翻译 🔥⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    padding-top: 40px;
  }
  .container {
    width: 100%;
    max-width: 720px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 28px 20px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  h1 { text-align: center; font-size: 22px; color: #fff; margin-bottom: 2px; letter-spacing: 1px; }
  .subtitle { text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; margin-bottom: 20px; }

  /* 模式切换 */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 4px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-tab.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: 500;
  }
  .mode-tab:active { transform: scale(0.96); }

  /* 语音模式 */
  .voice-section, .text-section { display: none; }
  .voice-section.active, .text-section.active { display: block; }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    padding: 10px 16px; margin-bottom: 16px;
  }
  .status-left { display: flex; align-items: center; gap: 8px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555;
    transition: all 0.3s; flex-shrink: 0;
  }
  .status-dot.listening { background: #ff9100; box-shadow: 0 0 10px #ff910066; animation: pulse 0.8s infinite; }
  .status-dot.translating { background: #448aff; box-shadow: 0 0 10px #448aff66; animation: pulse 0.5s infinite; }
  .status-dot.idle { background: #555; }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }
  .status-text { color: rgba(255,255,255,0.6); font-size: 13px; }
  .lang-select {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; outline: none;
  }
  .lang-select option { background: #1a1a2e; color: #fff; }

  .btn-record {
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; font-size: 26px;
    cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; box-shadow: 0 6px 25px rgba(255,65,108,0.4);
  }
  .btn-record:active { transform: scale(0.9); }
  .btn-record.recording { background: linear-gradient(135deg, #e53935, #c62828); animation: rec-pulse 1.2s infinite; }
  @keyframes rec-pulse {
    0% { box-shadow: 0 6px 25px rgba(255,65,108,0.4); }
    50% { box-shadow: 0 6px 40px rgba(255,65,108,0.8); }
    100% { box-shadow: 0 6px 25px rgba(255,65,108,0.4); }
  }

  .interim-text {
    color: rgba(255,255,255,0.25); font-size: 13px; font-style: italic;
    text-align: center; padding: 8px; min-height: 20px;
  }
  .error-msg {
    background: rgba(255,50,50,0.15); border: 1px solid rgba(255,50,50,0.3);
    color: #ff6b6b; padding: 8px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: none;
  }

  /* 文字输入模式 */
  .input-area {
    display: flex; gap: 10px; margin-bottom: 12px;
  }
  .text-input {
    flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 16px; outline: none; resize: none;
    min-height: 48px; max-height: 120px; font-family: inherit;
  }
  .text-input::placeholder { color: rgba(255,255,255,0.25); }
  .text-input:focus { border-color: rgba(68,138,255,0.5); }
  .btn-translate {
    padding: 12px 20px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #448aff, #2979ff); color: #fff;
    font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .btn-translate:active { transform: scale(0.95); }

  /* 翻译结果显示区 */
  .transcript-area {
    background: rgba(0,0,0,0.3); border-radius: 14px; padding: 16px;
    min-height: 180px; max-height: 360px; overflow-y: auto; margin-bottom: 12px;
  }
  .transcript-area::-webkit-scrollbar { width: 4px; }
  .transcript-area::-webkit-scrollbar-track { background: transparent; }
  .transcript-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .message { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .message:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .msg-original { color: rgba(255,255,255,0.8); font-size: 15px; line-height: 1.6; margin-bottom: 3px; }
  .msg-translated { color: #80d8ff; font-size: 17px; line-height: 1.6; font-weight: 500; }
  .msg-time { color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 3px; }
  .msg-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); margin-right: 4px; }

  .placeholder-text { color: rgba(255,255,255,0.15); text-align: center; padding: 30px 16px; font-size: 14px; line-height: 1.8; }

  .controls-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-clear {
    padding: 8px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .btn-clear:active { background: rgba(255,255,255,0.1); color: #fff; }

  .support-note {
    text-align: center; color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 14px;
  }

  @media (max-width: 480px) {
    body { padding: 12px; padding-top: 24px; }
    .container { padding: 20px 16px; }
    h1 { font-size: 19px; }
    .text-input { font-size: 15px; }
    .msg-translated { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔥⚡ 火雷翻译</h1>
  <p class="subtitle">语音识别 · 文字输入 · 自动翻译</p>

  <!-- 模式切换 -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="text" id="tabText">⌨️ 文字输入</button>
    <button class="mode-tab" data-mode="voice" id="tabVoice">🎤 语音识别</button>
  </div>

  <!-- 语音模式 -->
  <div class="voice-section" id="voiceSection">
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot idle" id="statusDot"></div>
        <span class="status-text" id="statusText">待机中</span>
      </div>
      <select class="lang-select" id="inputLang">
        <option value="en-US">英语</option>
        <option value="ja-JP">日语</option>
        <option value="ko-KR">韩语</option>
        <option value="fr-FR">法语</option>
        <option value="de-DE">德语</option>
        <option value="es-ES">西语</option>
      </select>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-record" id="btnRecord">🎤</button>
    <div class="interim-text" id="interimText">🎤 点击按钮开始录音</div>
  </div>

  <!-- 文字输入模式 -->
  <div class="text-section active" id="textSection">
    <div class="input-area">
      <textarea class="text-input" id="textInput" placeholder="输入英文，自动翻译成中文..." rows="2"></textarea>
      <button class="btn-translate" id="btnTranslate">翻译</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="btn-clear" style="font-size:12px;padding:6px 14px;" id="btnPaste">📋 粘贴</button>
      <button class="btn-clear" style="font-size:12px;padding:6px 14px;" id="btnClearInput">清空</button>
    </div>
  </div>

  <!-- 翻译结果 -->
  <div class="transcript-area" id="transcriptArea">
    <div class="placeholder-text">
      🔥⚡ 选择输入方式开始翻译<br>
      对方说话或输入英文，实时显示中文
    </div>
  </div>

  <div class="controls-row">
    <button class="btn-clear" id="btnClear">🗑️ 清空记录</button>
  </div>

  <div class="support-note">翻译结果仅供参考 | 由 Google Translate 提供支持</div>
</div>

<script>
// ===== 状态 =====
let transcriptHistory = [];
let recognition = null;
let isRecording = false;
let currentMode = 'text'; // 'text' or 'voice'

const TRANSLATE_API = 'google';

// ===== DOM =====
const tabText = document.getElementById('tabText');
const tabVoice = document.getElementById('tabVoice');
const voiceSection = document.getElementById('voiceSection');
const textSection = document.getElementById('textSection');
const btnRecord = document.getElementById('btnRecord');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const interimText = document.getElementById('interimText');
const transcriptArea = document.getElementById('transcriptArea');
const errorMsg = document.getElementById('errorMsg');
const inputLang = document.getElementById('inputLang');
const textInput = document.getElementById('textInput');
const btnTranslate = document.getElementById('btnTranslate');
const btnClear = document.getElementById('btnClear');
const btnClearInput = document.getElementById('btnClearInput');
const btnPaste = document.getElementById('btnPaste');

// ===== 模式切换 =====
tabText.addEventListener('click', () => {
  if (isRecording) stopRecording();
  currentMode = 'text';
  tabText.classList.add('active');
  tabVoice.classList.remove('active');
  voiceSection.classList.remove('active');
  textSection.classList.add('active');
});

tabVoice.addEventListener('click', () => {
  currentMode = 'voice';
  tabVoice.classList.add('active');
  tabText.classList.remove('active');
  textSection.classList.remove('active');
  voiceSection.classList.add('active');
  // 检测是否支持语音
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showError('您的浏览器不支持语音识别，请使用 Chrome 浏览器或切换到文字输入模式');
  }
});

// ===== 翻译函数 =====
async function translateAndShow(text) {
  if (!text || text.trim().length < 1) return;
  const trimmed = text.trim();
  
  // 去重
  if (transcriptHistory.length > 0) {
    const last = transcriptHistory[transcriptHistory.length - 1];
    if (last.original === trimmed) return;
  }

  setStatus('translating', '翻译中...');

  let translated = '';
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=${encodeURIComponent(trimmed)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data && data[0]) {
      translated = data[0].map(item => item[0]).join('');
    } else {
      translated = trimmed;
    }
  } catch(e) {
    translated = trimmed + ' (翻译失败)';
  }

  if (translated) {
    transcriptHistory.push({
      original: trimmed,
      translated: translated,
      time: new Date().toLocaleTimeString('zh-CN', { hour12: false })
    });
    renderTranscript();
    setStatus('listening', '录音中...');
  }
}

// ===== 语音识别 =====
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showError('不支持语音识别'); return false; }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = inputLang.value;

  recognition.onstart = () => {
    isRecording = true;
    btnRecord.classList.add('recording');
    btnRecord.textContent = '⏹';
    setStatus('listening', '录音中...');
    interimText.textContent = '正在聆听...';
    hideError();
  };

  recognition.onresult = (event) => {
    let final = '';
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t + ' ';
      else interim += t;
    }
    if (final) translateAndShow(final);
    interimText.textContent = interim || '等待语音输入...';
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') { interimText.textContent = '未检测到语音...'; return; }
    if (e.error === 'aborted') return;
    showError(`语音识别错误: ${e.error}，可切换到文字输入模式`);
    stopRecording();
  };

  recognition.onend = () => {
    if (isRecording) {
      setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
    }
  };
  return true;
}

function startRecording() {
  if (!recognition && !initSpeech()) return;
  recognition.lang = inputLang.value;
  try { recognition.start(); } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  btnRecord.classList.remove('recording');
  btnRecord.textContent = '🎤';
  setStatus('idle', '已停止');
  interimText.textContent = '⏸ 已暂停';
  if (recognition) try { recognition.stop(); } catch(e) {}
}

btnRecord.addEventListener('click', () => {
  isRecording ? stopRecording() : startRecording();
});

inputLang.addEventListener('change', () => {
  if (recognition) recognition.lang = inputLang.value;
});

// ===== 文字输入翻译 =====
btnTranslate.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (!text) { textInput.focus(); return; }
  translateAndShow(text);
  textInput.value = '';
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    btnTranslate.click();
  }
});

btnClearInput.addEventListener('click', () => {
  textInput.value = '';
  textInput.focus();
});

btnPaste.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      textInput.value = text;
      translateAndShow(text);
      textInput.value = '';
    }
  } catch(e) {
    showError('粘贴失败，请手动输入');
  }
});

// ===== UI =====
function renderTranscript() {
  if (transcriptHistory.length === 0) {
    transcriptArea.innerHTML = `<div class="placeholder-text">🔥⚡ 选择输入方式开始翻译</div>`;
    return;
  }
  const items = transcriptHistory.slice(-30);
  transcriptArea.innerHTML = items.map(item => `
    <div class="message">
      <div class="msg-original">${esc(item.original)}</div>
      <div class="msg-translated">${esc(item.translated)}</div>
      <div class="msg-time"><span class="msg-tag">原文</span>${item.time}</div>
    </div>
  `).join('');
  transcriptArea.scrollTop = transcriptArea.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setStatus(state, text) {
  statusDot.className = 'status-dot';
  if (state === 'listening') statusDot.classList.add('listening');
  else if (state === 'translating') statusDot.classList.add('translating');
  else statusDot.classList.add('idle');
  statusText.textContent = text;
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
}

function hideError() { errorMsg.style.display = 'none'; }

btnClear.addEventListener('click', () => {
  transcriptHistory = [];
  renderTranscript();
});

// ===== 检查语音支持 =====
if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
  // 默认显示文字模式
  tabText.click();
}
</script>
</body>
</html>
