<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>火雷对话翻译 🔥⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0c29;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    padding: 12px;
  }
  .container {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; padding: 24px 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 { text-align: center; font-size: 20px; color: #fff; margin-bottom: 4px; }
  .sub { text-align: center; color: rgba(255,255,255,0.35); font-size: 12px; margin-bottom: 20px; }

  /* 语言选择行 */
  .lang-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 24px;
  }
  .lang-box {
    background: rgba(255,255,255,0.06); border-radius: 10px;
    padding: 8px 14px; color: rgba(255,255,255,0.7); font-size: 14px;
    text-align: center; min-width: 70px;
  }
  .lang-box.active-source { color: #ff9100; border: 1px solid rgba(255,145,0,0.3); }
  .lang-box.active-target { color: #80d8ff; border: 1px solid rgba(128,216,255,0.3); }
  .arrow { color: rgba(255,255,255,0.2); font-size: 18px; }

  /* 录音按钮 */
  .record-area {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 20px;
  }
  .btn-record {
    width: 80px; height: 80px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: #fff; font-size: 32px; cursor: pointer;
    transition: all 0.15s; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(255,65,108,0.3);
    position: relative;
  }
  .btn-record:active { transform: scale(0.92); }
  .btn-record.recording {
    background: #e53935;
    animation: rec-pulse 0.6s infinite;
  }
  @keyframes rec-pulse {
    0% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
    50% { transform: scale(1.06); box-shadow: 0 8px 50px rgba(255,65,108,0.7); }
    100% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
  }
  .record-hint {
    color: rgba(255,255,255,0.3);
    font-size: 13px; margin-top: 10px; text-align: center;
    min-height: 20px;
  }
  .record-hint.active { color: #ff9100; }

  /* 翻译结果显示 */
  .result-area {
    background: rgba(0,0,0,0.35);
    border-radius: 16px; padding: 16px;
    min-height: 120px; max-height: 300px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .result-area::-webkit-scrollbar { width: 3px; }
  .result-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .result-item {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .result-item:last-child { border-bottom: none; }

  .result-original {
    color: rgba(255,255,255,0.7);
    font-size: 14px; line-height: 1.5; margin-bottom: 2px;
  }
  .result-translated {
    color: #80d8ff;
    font-size: 17px; line-height: 1.5; font-weight: 500;
  }
  .result-label {
    display: inline-block; font-size: 10px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.3);
    padding: 1px 6px; border-radius: 6px;
    margin-right: 4px;
  }
  .result-time {
    font-size: 10px; color: rgba(255,255,255,0.15);
    margin-top: 2px;
  }

  .placeholder {
    text-align: center; color: rgba(255,255,255,0.12);
    padding: 30px 10px; font-size: 14px; line-height: 1.8;
  }

  .controls {
    display: flex; gap: 10px; justify-content: center;
  }
  .btn-clear {
    padding: 8px 20px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.4); font-size: 13px;
    cursor: pointer;
  }
  .btn-clear:active { background: rgba(255,255,255,0.08); }

  .status-dot-wrap {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 12px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #555;
  }
  .dot.active { background: #00e676; box-shadow: 0 0 8px #00e67666; animation: blink 1s infinite; }
  .dot.recording { background: #ff9100; box-shadow: 0 0 8px #ff910066; animation: blink 0.5s infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status-text { color: rgba(255,255,255,0.35); font-size: 12px; }

  .debug-msg {
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.2); font-size: 11px;
    padding: 8px 12px; border-radius: 8px;
    margin-top: 12px; text-align: center;
    display: none;
  }

  @media (max-width: 400px) {
    .container { padding: 18px 12px; }
    .btn-record { width: 72px; height: 72px; font-size: 28px; }
    .result-translated { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔥⚡ 火雷对话翻译</h1>
  <p class="sub">按住录音 · 松手翻译 · 中英互译</p>

  <div class="status-dot-wrap">
    <span class="dot" id="statusDot"></span>
    <span class="status-text" id="statusText">待机中</span>
  </div>

  <div class="lang-row">
    <div class="lang-box active-source" id="langSource">英语</div>
    <span class="arrow">→</span>
    <div class="lang-box active-target" id="langTarget">中文</div>
  </div>

  <div class="record-area">
    <button class="btn-record" id="btnRecord">🎤</button>
    <div class="record-hint" id="recordHint">👇 按住说话，松手翻译</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="placeholder">
      按住🎤按钮<br>
      对方说英语，松手显示中文<br>
      或您说中文，松手显示英文
    </div>
  </div>

  <div class="controls">
    <button class="btn-clear" id="btnClear">🗑️ 清空</button>
  </div>

  <div class="debug-msg" id="debugMsg"></div>
</div>

<script>
// ====== 状态 ======
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let transcriptHistory = [];

// 自动检测方向：源语言和目标语言
// 默认：英语→中文
let sourceLang = 'en';
let targetLang = 'zh-CN';

const DOM = {
  btn: document.getElementById('btnRecord'),
  hint: document.getElementById('recordHint'),
  area: document.getElementById('resultArea'),
  dot: document.getElementById('statusDot'),
  status: document.getElementById('statusText'),
  debug: document.getElementById('debugMsg'),
  clear: document.getElementById('btnClear'),
  langSrc: document.getElementById('langSource'),
  langTgt: document.getElementById('langTarget'),
};

// ====== 录音 ======
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // 优先使用 webm/opus（几乎所有浏览器支持）
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : 'audio/mp4';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      // 停止所有轨道
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mimeType });
      await processAudio(blob);
    };

    mediaRecorder.start();
    isRecording = true;
    DOM.btn.classList.add('recording');
    DOM.btn.textContent = '⏹';
    DOM.hint.textContent = '🔴 录音中...松手停止';
    DOM.hint.classList.add('active');
    setStatus('recording', '录音中...');
    log('录音开始');
  } catch (e) {
    log('麦克风错误: ' + e.message);
    DOM.hint.textContent = '❌ 无法访问麦克风，请授权';
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      DOM.hint.textContent = '❌ 请在浏览器设置中允许麦克风权限';
    }
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  DOM.btn.classList.remove('recording');
  DOM.btn.textContent = '🎤';
  DOM.hint.textContent = '🔄 翻译中...';
  DOM.hint.classList.remove('active');
  setStatus('translating', '翻译中...');
}

// ====== 语音识别（使用免费 API） ======
async function processAudio(blob) {
  log(`录音完成: ${(blob.size / 1024).toFixed(1)}KB`);

  try {
    // 使用 AssemblyAI 或 Whisper 的免费接口
    // 先用 whisper 的免费 API（通过 huggingface 或直接调用）
    const text = await speechToText(blob);
    if (text && text.trim()) {
      log(`识别结果: ${text}`);
      await translateAndShow(text);
    } else {
      DOM.hint.textContent = '⚠️ 未识别到语音，请重试';
      setStatus('idle', '待机中');
    }
  } catch (e) {
    log(`处理失败: ${e.message}`);
    DOM.hint.textContent = '❌ 识别失败，请重试';
    setStatus('idle', '待机中');
  }
}

// 语音识别：使用浏览器原生 Speech Recognition（如果有）
// 或使用免费 API 服务
async function speechToText(blob) {
  // 方案1：如果浏览器支持 Web Speech API（Chrome），用它
  // 但鸿蒙不支持，所以直接用 API
  return await recognizeWithFreeAPI(blob);
}

// 使用免费的语音识别 API
async function recognizeWithFreeAPI(blob) {
  // 尝试多个免费方案

  // 方案A: 使用 whisper.cpp 的免费接口
  // 方案B: 使用 Google Speech-to-Text 的免费层
  // 先用 Google 的免费识别接口
  try {
    // 使用 OpenAI Whisper API 的免费替代
    // 先用 Speechly 的免费 demo API
    // 或者直接用 HuggingFace 的免费推理 API

    // 最简单方案：用 Google Translate 的语音 API
    // 将音频转为 base64
    const reader = new FileReader();
    const b64 = await new Promise((resolve, reject) => {
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });

    // 尝试 HuggingFace 的免费 Whisper API
    const resp = await fetch('https://api-inference.huggingface.co/models/openai/whisper-small', {
      method: 'POST',
      headers: {
        'Content-Type': 'audio/webm',
      },
      body: blob
    });

    if (resp.ok) {
      const data = await resp.json();
      if (data && data.text) {
        return data.text;
      }
    }

    throw new Error('HuggingFace API failed');

  } catch(e) {
    log(`API方案A失败: ${e.message}`);

    // 方案B: 用浏览器自身的语音识别（作为备选）
    try {
      return await recognizeWithBrowser(blob);
    } catch(e2) {
      log(`浏览器识别也失败: ${e2.message}`);
      throw new Error('所有识别方案都失败了');
    }
  }
}

// 浏览器语音识别（兜底方案）
function recognizeWithBrowser(blob) {
  return new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      reject(new Error('浏览器不支持语音识别'));
      return;
    }

    // 对于鸿蒙等不支持 continuous 模式的浏览器
    // 我们只能用一次性识别
    const recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      resolve(text);
    };

    recognition.onerror = (e) => {
      reject(new Error(`语音识别错误: ${e.error}`));
    };

    try {
      recognition.start();
      // 3秒后如果没有结果，超时
      setTimeout(() => {
        try { recognition.stop(); } catch(e) {}
        reject(new Error('识别超时'));
      }, 5000);
    } catch(e) {
      reject(e);
    }
  });
}

// ====== 翻译 ======
async function translateAndShow(text) {
  const trimmed = text.trim();
  if (!trimmed) return;

  // 自动检测语言方向
  // 如果包含中文字符，就是中文→英语
  const hasChinese = /[\u4e00-\u9fa5]/.test(trimmed);
  const sl = hasChinese ? 'zh-CN' : 'auto';
  const tl = hasChinese ? 'en' : 'zh-CN';

  DOM.langSrc.textContent = hasChinese ? '中文' : '英语';
  DOM.langTgt.textContent = hasChinese ? '英语' : '中文';

  let translated = '';
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(trimmed)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data && data[0]) {
      translated = data[0].map(item => item[0]).join('');
    }
  } catch(e) {
    translated = trimmed;
  }

  // 去重
  if (transcriptHistory.length > 0) {
    const last = transcriptHistory[transcriptHistory.length - 1];
    if (last.original === trimmed) return;
  }

  transcriptHistory.push({
    original: trimmed,
    translated: translated || trimmed,
    time: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
    lang: hasChinese ? 'zh→en' : 'en→zh'
  });

  renderResults();
  DOM.hint.textContent = '👇 继续按住说话';
  setStatus('idle', '待机中');
  log(`翻译完成: ${translated}`);
}

// ====== UI ======
function renderResults() {
  if (transcriptHistory.length === 0) {
    DOM.area.innerHTML = `<div class="placeholder">按住🎤按钮<br>对方说英语，松手显示中文</div>`;
    return;
  }
  const items = transcriptHistory.slice(-20);
  DOM.area.innerHTML = items.map(item => `
    <div class="result-item">
      <div class="result-original"><span class="result-label">${item.lang || '识别'}</span>${esc(item.original)}</div>
      <div class="result-translated">${esc(item.translated)}</div>
      <div class="result-time">${item.time}</div>
    </div>
  `).join('');
  DOM.area.scrollTop = DOM.area.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setStatus(state, text) {
  DOM.dot.className = 'dot';
  if (state === 'recording') DOM.dot.classList.add('recording');
  else if (state === 'translating') DOM.dot.classList.add('active');
  DOM.status.textContent = text;
}

function log(msg) {
  DOM.debug.textContent = msg;
  DOM.debug.style.display = 'block';
  setTimeout(() => { DOM.debug.style.display = 'none'; }, 3000);
  console.log(msg);
}

// ====== 事件 ======
// 按住录音（移动端用 touch，PC 用 mouse）
let pressTimer = null;

function handlePressStart(e) {
  e.preventDefault();
  if (isRecording) return;
  startRecording();
}

function handlePressEnd(e) {
  e.preventDefault();
  if (isRecording) {
    stopRecording();
  }
}

// 移动端触摸事件
DOM.btn.addEventListener('touchstart', handlePressStart, { passive: false });
DOM.btn.addEventListener('touchend', handlePressEnd, { passive: false });
DOM.btn.addEventListener('touchcancel', handlePressEnd, { passive: false });

// PC 端鼠标事件
DOM.btn.addEventListener('mousedown', handlePressStart);
DOM.btn.addEventListener('mouseup', handlePressEnd);
DOM.btn.addEventListener('mouseleave', (e) => {
  if (isRecording) stopRecording();
});

// 清空
DOM.clear.addEventListener('click', () => {
  transcriptHistory = [];
  renderResults();
  DOM.hint.textContent = '👇 按住说话，松手翻译';
});

// ====== 初始化 ======
log('🟢 翻译工具已就绪');
</script>
</body>
</html>
