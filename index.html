<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>火雷对话翻译 🔥⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0c29;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    padding: 12px;
  }
  .container {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; padding: 24px 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 { text-align: center; font-size: 20px; color: #fff; margin-bottom: 4px; }
  .sub { text-align: center; color: rgba(255,255,255,0.35); font-size: 12px; margin-bottom: 20px; }

  .lang-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 24px;
  }
  .lang-box {
    background: rgba(255,255,255,0.06); border-radius: 10px;
    padding: 8px 14px; color: rgba(255,255,255,0.7); font-size: 14px;
    text-align: center; min-width: 70px;
  }
  .lang-box.src { color: #ff9100; border: 1px solid rgba(255,145,0,0.3); }
  .lang-box.tgt { color: #80d8ff; border: 1px solid rgba(128,216,255,0.3); }
  .arrow { color: rgba(255,255,255,0.2); font-size: 18px; }

  .record-area {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 20px;
  }
  .btn-record {
    width: 80px; height: 80px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: #fff; font-size: 32px; cursor: pointer;
    transition: all 0.15s; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(255,65,108,0.3);
  }
  .btn-record:active { transform: scale(0.92); }
  .btn-record.recording {
    background: #e53935;
    animation: rec-pulse 0.6s infinite;
  }
  @keyframes rec-pulse {
    0% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
    50% { transform: scale(1.06); box-shadow: 0 8px 50px rgba(255,65,108,0.7); }
    100% { transform: scale(1); box-shadow: 0 8px 30px rgba(255,65,108,0.3); }
  }
  .record-hint {
    color: rgba(255,255,255,0.3);
    font-size: 13px; margin-top: 10px; text-align: center;
    min-height: 20px;
  }
  .record-hint.active { color: #ff9100; }

  .result-area {
    background: rgba(0,0,0,0.35);
    border-radius: 16px; padding: 16px;
    min-height: 120px; max-height: 300px;
    overflow-y: auto; margin-bottom: 12px;
  }
  .result-area::-webkit-scrollbar { width: 3px; }
  .result-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .result-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .result-item:last-child { border-bottom: none; }
  .result-original { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.5; margin-bottom: 2px; }
  .result-translated { color: #80d8ff; font-size: 17px; line-height: 1.5; font-weight: 500; }
  .result-label { display: inline-block; font-size: 10px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); padding: 1px 6px; border-radius: 6px; margin-right: 4px; }
  .result-time { font-size: 10px; color: rgba(255,255,255,0.15); margin-top: 2px; }
  .placeholder { text-align: center; color: rgba(255,255,255,0.12); padding: 30px 10px; font-size: 14px; line-height: 1.8; }

  .controls { display: flex; gap: 10px; justify-content: center; }
  .btn-clear { padding: 8px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.4); font-size: 13px; cursor: pointer; }
  .btn-clear:active { background: rgba(255,255,255,0.08); }

  .status-dot-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #555; }
  .dot.active { background: #00e676; box-shadow: 0 0 8px #00e67666; animation: blink 1s infinite; }
  .dot.recording { background: #ff9100; box-shadow: 0 0 8px #ff910066; animation: blink 0.5s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-text { color: rgba(255,255,255,0.35); font-size: 12px; }

  @media (max-width: 400px) {
    .container { padding: 18px 12px; }
    .btn-record { width: 72px; height: 72px; font-size: 28px; }
    .result-translated { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔥⚡ 火雷对话翻译</h1>
  <p class="sub">按住录音 · 松手翻译 · 中英互译</p>

  <div class="status-dot-wrap">
    <span class="dot" id="statusDot"></span>
    <span class="status-text" id="statusText">待机中</span>
  </div>

  <div class="lang-row">
    <div class="lang-box src" id="langSource">英语</div>
    <span class="arrow">→</span>
    <div class="lang-box tgt" id="langTarget">中文</div>
  </div>

  <div class="record-area">
    <button class="btn-record" id="btnRecord">🎤</button>
    <div class="record-hint" id="recordHint">👇 按住说话，松手翻译</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="placeholder">
      按住🎤按钮<br>
      对方说英语，松手显示中文<br>
      或您说中文，松手显示英文
    </div>
  </div>

  <div class="controls">
    <button class="btn-clear" id="btnClear">🗑️ 清空</button>
  </div>
</div>

<script>
// ====== 状态 ======
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let transcriptHistory = [];

const DOM = {
  btn: document.getElementById('btnRecord'),
  hint: document.getElementById('recordHint'),
  area: document.getElementById('resultArea'),
  dot: document.getElementById('statusDot'),
  status: document.getElementById('statusText'),
  clear: document.getElementById('btnClear'),
  langSrc: document.getElementById('langSource'),
  langTgt: document.getElementById('langTarget'),
};

// ====== 录音 ======
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/mp4';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mimeType });
      await processAudio(blob);
    };

    mediaRecorder.start();
    isRecording = true;
    DOM.btn.classList.add('recording');
    DOM.btn.textContent = '⏹';
    DOM.hint.textContent = '🔴 录音中...松手停止';
    DOM.hint.classList.add('active');
    setStatus('recording', '录音中...');
  } catch (e) {
    DOM.hint.textContent = '❌ 无法访问麦克风，请在设置中授权';
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  DOM.btn.classList.remove('recording');
  DOM.btn.textContent = '🎤';
  DOM.hint.textContent = '🔄 识别翻译中...';
  DOM.hint.classList.remove('active');
  setStatus('translating', '识别中...');
}

// ====== 语音识别 + 翻译 ======
async function processAudio(blob) {
  try {
    const text = await recognizeSpeech(blob);
    if (text && text.trim()) {
      await translateAndShow(text.trim());
    } else {
      DOM.hint.textContent = '⚠️ 未识别到语音，请重试';
      setStatus('idle', '待机中');
    }
  } catch (e) {
    DOM.hint.textContent = '❌ 识别失败，请重试';
    setStatus('idle', '待机中');
  }
}

// 核心：语音识别 - 先用 HuggingFace Whisper API
async function recognizeSpeech(blob) {
  // 方法1: HuggingFace Whisper（免费，不需要 API key）
  try {
    const resp = await fetch('https://api-inference.huggingface.co/models/openai/whisper-small', {
      method: 'POST',
      headers: { 'Content-Type': blob.type },
      body: blob
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data && data.text) return data.text;
    }
    // 如果 HuggingFace 返回模型加载中，等一会重试
    if (resp.status === 503) {
      // Model is loading, wait and retry once
      await new Promise(r => setTimeout(r, 3000));
      const retry = await fetch('https://api-inference.huggingface.co/models/openai/whisper-small', {
        method: 'POST',
        headers: { 'Content-Type': blob.type },
        body: blob
      });
      if (retry.ok) {
        const d = await retry.json();
        if (d && d.text) return d.text;
      }
    }
  } catch(e) {
    // fall through
  }

  // 方法2: 用 whisper-tiny 更轻量的模型
  try {
    const resp = await fetch('https://api-inference.huggingface.co/models/openai/whisper-tiny.en', {
      method: 'POST',
      headers: { 'Content-Type': blob.type },
      body: blob
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data && data.text) return data.text;
    }
  } catch(e) {
    // fall through
  }

  // 方法3: 用 SpeechRecognizer API (Chrome 兜底)
  try {
    return await browserSpeechRecognition();
  } catch(e) {
    throw new Error('所有识别方式都失败了');
  }
}

// 浏览器 Speech Recognition 兜底
function browserSpeechRecognition() {
  return new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      reject(new Error('no SR'));
      return;
    }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = 'en-US';

    let timeout = setTimeout(() => {
      try { rec.stop(); } catch(e) {}
      reject(new Error('timeout'));
    }, 6000);

    rec.onresult = (e) => {
      clearTimeout(timeout);
      resolve(e.results[0][0].transcript);
    };
    rec.onerror = (e) => {
      clearTimeout(timeout);
      reject(e);
    };
    rec.start();
  });
}

// ====== 翻译 ======
async function translateAndShow(text) {
  const trimmed = text.trim();
  if (!trimmed) return;

  // 自动检测语言
  const hasChinese = /[\u4e00-\u9fa5]/.test(trimmed);
  const sl = hasChinese ? 'zh-CN' : 'auto';
  const tl = hasChinese ? 'en' : 'zh-CN';

  DOM.langSrc.textContent = hasChinese ? '中文' : '英语';
  DOM.langTgt.textContent = hasChinese ? '英语' : '中文';

  let translated = text;
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(trimmed)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data && data[0]) {
      translated = data[0].map(item => item[0]).join('');
    }
  } catch(e) {}

  // 去重
  if (transcriptHistory.length > 0) {
    const last = transcriptHistory[transcriptHistory.length - 1];
    if (last.original === trimmed) return;
  }

  transcriptHistory.push({
    original: trimmed,
    translated: translated,
    time: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
    dir: hasChinese ? 'zh→en' : 'en→zh'
  });

  renderResults();
  DOM.hint.textContent = '✅ 翻译完成，继续按住说话';
  setStatus('idle', '待机中');
}

// ====== UI ======
function renderResults() {
  if (transcriptHistory.length === 0) {
    DOM.area.innerHTML = `<div class="placeholder">按住🎤按钮<br>对方说英语，松手显示中文</div>`;
    return;
  }
  const items = transcriptHistory.slice(-20);
  DOM.area.innerHTML = items.map(item => `
    <div class="result-item">
      <div class="result-original"><span class="result-label">${item.dir || '识别'}</span>${esc(item.original)}</div>
      <div class="result-translated">${esc(item.translated)}</div>
      <div class="result-time">${item.time}</div>
    </div>
  `).join('');
  DOM.area.scrollTop = DOM.area.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setStatus(state, text) {
  DOM.dot.className = 'dot';
  if (state === 'recording') DOM.dot.classList.add('recording');
  else if (state === 'translating') DOM.dot.classList.add('active');
  DOM.status.textContent = text;
}

// ====== 事件 ======
function handlePressStart(e) {
  e.preventDefault();
  if (isRecording) return;
  startRecording();
}
function handlePressEnd(e) {
  e.preventDefault();
  if (isRecording) stopRecording();
}

// 触摸
DOM.btn.addEventListener('touchstart', handlePressStart, { passive: false });
DOM.btn.addEventListener('touchend', handlePressEnd, { passive: false });
DOM.btn.addEventListener('touchcancel', handlePressEnd, { passive: false });

// 鼠标
DOM.btn.addEventListener('mousedown', handlePressStart);
DOM.btn.addEventListener('mouseup', handlePressEnd);
DOM.btn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });

DOM.clear.addEventListener('click', () => {
  transcriptHistory = [];
  renderResults();
  DOM.hint.textContent = '👇 按住说话，松手翻译';
});
</script>
</body>
</html>
